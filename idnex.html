<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://kit.fontawesome.com/46057189c5.js" crossorigin="anonymous"></script>
    <title> Impressive E-Portfolio </title>
</head>
<body>
    <section id="landing">
        <div class="landing__container">
            <div class="landing__nav--bar">
                <div class="landing__nav--row">
                    <figure><img class="nav__logo" src="./assets/Possible_Logo_002.jpg"></figure>
                    <ul class="nav__btn--list">
                        <li class="nav__list"> About </li>
                        <li class="nav__list"> Projects </li>
                        <li class="nav__list">Contact </li>
                        <li class="nav__btn"><button class="nav__btn--contrast"><i class="fa-solid fa-circle-half-stroke"></i></button></li>
                    </ul>
                </div>
            </div>
            <div class="landing__about--me">
                <div class="about__me--row">
                    <div class="about__me--column">
                        <h1 class="about__me--name"> Hey <span class="text--red"><br> I'm Kevin </span></h1>
                        <p class="about__me--description"> I'm a <span class="text--red"> Frontend Software Engineer </span> with a 
                            <br> strong passion for building web 
                            <br> applications iwth great user exeriences.
                            <br> Here's a bit more <span class="text--red"> about me. </span>
                        </p>
                        <ul class="about__me--links">
                            <li class="about__me--link"><a href="https://github.com/REDDraco1628" target="_blank"><i class="fa-brands fa-github"></i></a></li>
                            <li class="about__me--link"><a href="https://www.linkedin.com/in/kevin-hobbs-34218421b/" target="_blank"><i class="fa-brands fa-linkedin"></i></a></li>
                            <li class="about__me--link"><a href="./assets/resume-1787089729595.pdf" target="_blank"><i class="fa-solid fa-file"></i></a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <figure><img class="background__img--level01" src="./assets/FireSpark__background--level01.png" alt="background__img--level01"></figure>
            <figure><img class="background__img--level02" src="./assets/FireSpark__background--level02.png" alt="background__img--level02"></figure>
        </div>
        <div class="mail__container">
            <div class="mail__row">
                <a href="#projects" class="scroll"><div class="scroll__icon"></div></a>
                <button class="mail__btn"><i class="fa-regular fa-envelope"></i></button>
            </div>
        </div>
    </section>
    <section id="projects">

    </section>
</body>
</html>
